name: A page that looks wrong right to left
description: Something mirrored the wrong way, overlapping, or cut off in Arabic or Persian.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The menu path or the address after the host.
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme and browser
      description: System - Settings - General shows the theme.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong
      description: A screenshot helps most. Take out addresses and host names first.
    validations:
      required: true
