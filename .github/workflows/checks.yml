name: checks

# A translation is a pair of files that have to agree with each other and with the
# program they are for. The two ways this repository can be wrong without anybody
# noticing are a catalogue that gettext will refuse to load, and a compiled .mo that
# no longer matches the .po beside it - which means the file people install is not the
# file people review.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    name: catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: The .po is valid and its placeholders match
        # -c is the strict set: it checks the header, and it checks that the format
        # placeholders in each translation match the ones in the string it translates.
        # A %s dropped in translation is a crash in the program, not a typo.
        run: msgfmt -c --statistics -o /dev/null ar_SA.po

      - name: The compiled .mo is the one this .po produces
        run: |
          [ -f OPNsense.mo ] || { echo "nothing compiled here"; exit 0; }
          msgfmt -o /tmp/rebuilt.mo ar_SA.po
          # msgfmt output is deterministic for the same input and the same version, so a
          # difference means the .mo was built from something other than this .po.
          if ! cmp -s /tmp/rebuilt.mo OPNsense.mo; then
            echo "OPNsense.mo does not match ar_SA.po - rebuild it with:"
            echo "    msgfmt -o OPNsense.mo ar_SA.po"
            msgunfmt OPNsense.mo | msgcmp - ar_SA.po || true
            exit 1
          fi
          echo "the compiled catalogue matches its source"

      - name: Nothing left untranslated without saying so
        run: |
          total=$(msgfmt --statistics -o /dev/null ar_SA.po 2>&1 || true)
          echo "$total"

  privacy:
    name: nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real addresses, hardware identifiers or credentials
        run: python3 tools/check-private-data.py .
