name: checks

# This repository rewrites a stylesheet and installs it, so what can go wrong is a
# script that does not parse, a stylesheet with an unbalanced rule, or a rule written
# with `!important` where the cascade would have done - which is how an override sheet
# becomes impossible to override in turn.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        run: |
          shopt -s globstar nullglob
          files=(*.py tools/**/*.py)
          [ ${#files[@]} -gt 0 ] || { echo "no Python here"; exit 0; }
          python3 -m compileall -q "${files[@]}"
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes "${files[@]}"

      - name: Shell
        run: |
          for f in *.sh 61-opnsense-rtl; do
            [ -f "$f" ] || continue
            sh -n "$f" && echo "ok $f"
          done

      - name: Stylesheet
        run: |
          shopt -s nullglob
          for f in *.css; do
            python3 - "$f" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          # Comments first: a brace inside one is not a brace.
          stripped = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
          opened, closed = stripped.count('{'), stripped.count('}')
          if opened != closed:
              print('%s: %d "{" against %d "}" - an unclosed rule takes every rule after '
                    'it with it' % (path, opened, closed))
              sys.exit(1)
          if '/*' in text and text.count('/*') != text.count('*/'):
              print('%s: an unterminated comment swallows the rest of the file' % path)
              sys.exit(1)
          print('%s: %d rules, balanced' % (path, opened))
          PY
          done

  privacy:
    name: nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real addresses, hardware identifiers or credentials
        run: python3 tools/check-private-data.py .
